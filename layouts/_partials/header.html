<nav class="navbar" aria-label="Main navigation">
  <div class="container">
    <div class="nav-brand">
      <a href="{{ site.Home.RelPermalink }}">
        <span class="logo-prompt" aria-hidden="true">&gt;_</span>
        <span>{{ site.Title }}</span>
      </a>
    </div>

    <div class="nav-menu" id="nav-menu">
      {{- partial "menu.html" (dict "menuID" "main" "page" .) }}
      {{- with site.GetPage "/search" -}}
        <a class="nav-link nav-search-link" href="{{ .RelPermalink }}">Search</a>
      {{- end -}}
    </div>

    {{ partial "search-form.html" (dict "class" "search-form search-form--nav" "inputId" "nav-search-input" "placeholder" "Search…") }}

    <div class="nav-controls">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode">
        <svg class="theme-icon-light" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <svg class="theme-icon-dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <span class="theme-text" id="theme-text">Dark</span>
      </button>

      <button class="nav-hamburger" type="button" aria-label="Toggle navigation menu" aria-controls="nav-menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</nav>
