<nav class="navbar" aria-label="Main navigation">
  <div class="container">
    <div class="nav-brand">
      <a href="{{ site.Home.RelPermalink }}">
        <span class="logo-prompt" aria-hidden="true">&gt;_</span>
        <span>{{ site.Title }}</span>
      </a>
    </div>

    <div class="nav-menu" id="nav-menu">
      {{- partial "menu.html" (dict "menuID" "main" "page" .) }}
      {{- with site.GetPage "/search" -}}
        <a class="nav-link nav-search-link" href="{{ .RelPermalink }}">Search</a>
      {{- end -}}
    </div>

    {{ partial "search-form.html" (dict "class" "search-form search-form--nav" "inputId" "nav-search-input" "placeholder" "Search…") }}

    <div class="nav-controls">
      <button class="nav-hamburger" type="button" aria-label="Toggle navigation menu" aria-controls="nav-menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</nav>
